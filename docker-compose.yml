services:
  
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile-frontend
    ports:
      - "5173:5173"
  
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile-backend
      args:
        API_KEY: ${API_KEY}
    environment:
      - API_KEY=${API_KEY}
    ports:
      - "5000:5000"